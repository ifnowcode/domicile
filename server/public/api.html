<!DOCTYPE html>
<html>
<head>
  <title>API Documentation</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    code { background: #eee; padding: 2px 4px; }
  </style>
</head>
<body>
  <h1>API Documentation</h1>

  <h2>Posts</h2>
  <p><code>GET /api/posts</code> - list all posts</p>
  <p><code>GET /api/posts/:id</code> - get a single post</p>
  <p><code>POST /api/posts</code> - create a post</p>
  <p><code>PUT /api/posts/:id</code> - update a post</p>
  <p><code>DELETE /api/posts/:id</code> - delete a post</p>
</body>
</html>
