<style>
body {
  margin: 0;
  font-family: "Lato", sans-serif;
}

.flexbar {
  margin: 0;
  padding: 0;
  width: 200px;
  background-color: #444;
  position: fixed;
  height: 100%;
  overflow: auto;
}

.flexbar a {
  display: block;
  color: black;
  padding: 16px;
  text-decoration: none;
}
 
.flexbar a.active {
  background-color: #04AA6D;
  color: white;
}

.flexbar a:hover:not(.active) {
  background-color: #555;
  color: white;
}

div.content {
  margin-left: 200px;
  padding: 1px 16px;
  height: auto;
}

@media screen and (max-width: 700px) {
  .flexbar {
    width: 100%;
    height: auto;
    position: relative;
  }
  .flexbar a {float: left;}
  div.content {margin-left: 0;}
}

@media screen and (max-width: 400px) {
  .flexbar a {
    text-align: center;
    float: none;
  }
}
</style>
</head>
<body style="background:#111;color:lavender;">
