<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      text-align: center;
      max-width: 32rem;
      padding: 2rem;
    }
    h1 {
      font-size: 4rem;
      margin: 0;
    }
    p {
      line-height: 1.5;
      color: #94a3b8;
    }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>Sorry, the page you’re looking for doesn’t exist or has been moved.</p>
    <a href="/">Go home</a>
  </main>
</body>
</html>
